name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure iOS workspace exists
        run: |
          set -euo pipefail
          if [ -d ios/Runner.xcworkspace ]; then
            echo "Workspace already exists"
            ls -la ios/Runner.xcworkspace
          elif [ -f ios/Podfile ]; then
            echo "Podfile exists; installing CocoaPods workspace"
            if ! command -v pod >/dev/null 2>&1; then
              sudo gem install cocoapods --no-document
            fi
            cd ios
            pod install --repo-update
            cd -
          else
            echo "No Podfile; creating minimal workspace"
            mkdir -p ios/Runner.xcworkspace
            cat > ios/Runner.xcworkspace/contents.xcworkspacedata <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<Workspace version="1.0">
  <FileRef location="group:Runner.xcodeproj"/>
</Workspace>
EOF
            ls -la ios/Runner.xcworkspace
          fi

      - name: Build iOS app
        run: flutter build ios --release --no-codesign

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: build/ios/iphoneos/Runner.app
